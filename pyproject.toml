[project]
name = "fandea-contracts"
version = "0.1.0"
description = "Contracts-as-code layer for Fandea (ADR-0009). Not the runtime; see docs/implementation-plan.md."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jsonschema>=4",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
packages = ["contracts"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contracts"]
