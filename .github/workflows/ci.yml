name: ci

# Validates contracts/ (ADR-0009: the Pydantic models that are the normative structural
# source of truth, and everything generated from it) and src/fandea/ (the M0 walking
# skeleton, ADR per docs/implementation-plan.md M0).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "contracts/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "schema/**"
      - "skills/**"
      - "pyproject.toml"
      - "conftest.py"
      - ".github/workflows/ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check contracts/ src/ scripts/ tests/ conftest.py

      - name: Type-check (mypy)
        run: mypy contracts/ src/fandea/

      - name: Schema drift (schema/ must equal what contracts/ generates)
        run: python3 scripts/generate_schemas.py --check

      - name: Example drift (skills/bump-python-dep/v3/*.json must equal contracts/examples.py)
        run: python3 scripts/export_examples.py --check

      - name: Test suite (contracts, M0 walking skeleton, import boundary)
        run: pytest -v
